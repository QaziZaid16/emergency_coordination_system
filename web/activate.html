<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate responder account</title><link rel="stylesheet" href="admin/style.css"></head><body><main class="login-shell"><section class="login-card"><img class="logo" src="assets/brand/official-logo.svg" alt="Emergency Coordination"><p class="eyebrow">RESPONDER ONBOARDING</p><h1>Activate your account</h1><p id="status" class="muted">Set a password to complete your secure invitation.</p><form id="form"><label>Service URL<input id="api" type="url" placeholder="https://api.example.org" required></label><label>New password<input id="password" type="password" minlength="12" required></label><label>Confirm password<input id="confirm" type="password" minlength="12" required></label><button class="primary">Activate account</button></form></section></main><script>
const q=new URLSearchParams(location.search),token=q.get('token');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const status=document.querySelector('#status'),password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){status.textContent='Passwords do not match.';return}try{const base=document.querySelector('#api').value.replace(/\/$/,'');const r=await fetch(base+'/api/v1/auth/accept-invitation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Activation failed');status.textContent='Account activated. You can now sign in through the mobile app.';document.querySelector('#form').remove()}catch(err){status.textContent=err.message}};if(!token){document.querySelector('#status').textContent='This invitation link is incomplete. Ask your administrator to send a new invitation.';document.querySelector('#form').remove()}
</script></body></html>
