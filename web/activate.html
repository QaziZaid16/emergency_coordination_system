<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate responder account</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <img class="logo" src="/assets/brand/official-logo.svg" alt="Emergency Coordination">
      <p class="eyebrow">RESPONDER ONBOARDING</p>
      <h1>Activate your account</h1>
      <p id="status" class="muted">Set a password to complete your secure invitation.</p>
      <form id="form">
        <label id="api-label">Service URL<input id="api" type="url" placeholder="https://api.example.org" required></label>
        <label>New password<input id="password" type="password" minlength="12" required></label>
        <label>Confirm password<input id="confirm" type="password" minlength="12" required></label>
        <button class="primary">Activate account</button>
      </form>
    </section>
  </main>
  <script src="/admin/config.js"></script>
  <script src="/activation.js"></script>
</body>
</html>
